name: Build experimental MT7902 Wi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mt7902-wifi

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify both Intel kexts
        run: |
          bash tools/build-mt7902-wifi.sh
          source_dir=(build/mt7902-wifi.*/itlmt7922-wifi-*)
          cd "${source_dir[0]}"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            tests/native_join_test.cpp -o build/native_join_test
          build/native_join_test
          bash tests/run_protocol_tests.sh
          bash tests/run_codec_tests.sh
          kext=build/itlmt7922.kext
          native=build/itlmt7902Native.kext
          xcrun lipo "$kext/Contents/MacOS/itlmt7922" -verify_arch x86_64
          xcrun lipo "$native/Contents/MacOS/itlmt7902Native" -verify_arch x86_64
          file -b "$kext/Contents/MacOS/itlmt7922" | grep -F 'Mach-O 64-bit kext bundle x86_64'
          file -b "$native/Contents/MacOS/itlmt7902Native" | grep -F 'Mach-O 64-bit kext bundle x86_64'
          pci_match="$(plutil -extract IOKitPersonalities.itlmt7922.IOPCIMatch raw "$kext/Contents/Info.plist")"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$kext/Contents/Info.plist")"
          echo "PCI match $pci_match, bundle ID $bundle_id"
          test "$pci_match" = 0x790214c3
          test "$bundle_id" = local.x1605va.MT7902WiFi
          test "$(plutil -extract CFBundleIdentifier raw "$native/Contents/Info.plist")" = local.x1605va.MT7902Native
          test "$(plutil -extract IOKitPersonalities.itlmt7925Wifi.IOProviderClass raw "$native/Contents/Info.plist")" = itlmt7922
          for bundle in "$kext" "$native"; do
            plutil -lint "$bundle/Contents/Info.plist"
            test "$(plutil -extract CFBundleVersion raw "$bundle/Contents/Info.plist")" = 0.3.1
          done

          staging="$RUNNER_TEMP/MT7902-Tahoe-native"
          mkdir "$staging"
          cp -R "$kext" "$native" LICENSE NOTICE.md licenses NATIVE-FRONTEND-LICENSE NATIVE-FRONTEND-NOTICE.md "$staging/"
          cp fw/LICENCE.mediatek "$GITHUB_WORKSPACE/docs/MT7902-WIFI.md" "$staging/"
          ditto -c -k --keepParent "$staging" "$RUNNER_TEMP/MT7902-Tahoe-native.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MT7902-Tahoe-native
          path: ${{ runner.temp }}/MT7902-Tahoe-native.zip
          if-no-files-found: error
          retention-days: 7
